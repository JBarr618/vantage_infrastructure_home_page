    </h2>

    <p style="font-size: 22px;">
        Setting up a DC track circuit involves a precise and systematic process to ensure reliable train detection.
        The first crucial step is <b>defining the track block</b> that the circuit will protect. This is achieved by
        installing <b>insulated rail joints</b> at the beginning and end of the desired section.
    </p>

    <img src="images/Installing a glued Insulated Joint.jpeg"
    alt="Track crew installing an insulated joint into the track."
    style="width:350px; float:right; margin-left:20px; border-radius:10px;">

    <p style="font-size: 22px;">
        These joints must be properly installed and tested to guarantee electrical isolation from adjacent track sections.
        The length of a track circuit can vary depending on factors such as train speed, signal spacing, and the sensitivity
        requirements of the system.
    </p>

    <p style="font-size: 22px;">
        Once the block is defined, the <b>power source</b> needs to be connected to the rails at one end of the section.
        The polarity of the connection is important and must be consistent with the relay connection at the other end.
        Secure and reliable connections are essential to minimize voltage drops and ensure consistent current flow.
    </p>

    <img src="images/DC relay.jpeg"
    alt="DC track relay."
    style="width:350px; border-radius:10px;">

    <p style="font-size: 22px;">
        The <b>track relay</b> is installed at the opposite end of the track section and connected across the rails.
        The relay coil must be compatible with the voltage and current characteristics of the power source and the expected
        resistance of the track circuit.
    </p>

    <p style="font-size: 22px;">
        Finally, thorough <b>testing and calibration</b> are required after the initial setup. This involves measuring
        voltage and current at various points in the circuit, ensuring the relay operates correctly when a shunt is applied,
        and verifying that the insulated joints are effectively isolating the section.
    </p>

    <img src="images/Maintainer Testing Track Circuit.jpg"
    alt="Signal maintainer testing voltage and current across the rails."
    style="width:350px; border-radius:10px;">

    <p style="font-size: 22px;">
        Proper documentation of setup parameters and test results is also critical for future maintenance and troubleshooting.
        The entire process must follow established railroad standards and safety regulations to guarantee reliable and safe
        operation of the track circuit.
    </p>
